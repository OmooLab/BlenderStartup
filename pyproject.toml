[project]
name = "startup"
version = "0.2.23"
description = "OmooLab application template for Blender"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
pack = "tools.pack:main"
docs = "tools.docs:main"

[dependency-groups]
dev = [
    "mike>=2.1,<3",
    "mkdocs-material>=9.6,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
