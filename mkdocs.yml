site_name: Blender Startup
site_url: https://docs.omoolab.xyz/blender-startup/
site_author: OmooLab
site_description: OmooLab 为 Blender 打造的启动方案与 Refined Industry Compatible 快捷键文档。

repo_name: OmooLab/BlenderStartup
repo_url: https://github.com/OmooLab/BlenderStartup

nav:
  - 首页: index.md
  - 快速开始:
      - 安装与启用: getting-started/install.md
      - 五分钟上手: getting-started/first-five-minutes.md
      - 更新与卸载: getting-started/update-and-uninstall.md
  - 快捷键:
      - 方案概览: keymap/index.md
      - 主要改动: keymap/changes.md
      - 完整参考: reference/index.md
  - 实用功能:
      - 功能概览: features/index.md
      - Camera Bookmark: features/camera-bookmark.md
      - Toggle Phantom: features/toggle-phantom.md
      - OmooLab 在线内容: features/online-content.md
  - 配置与版本:
      - Omoo Lab 与版本差异: configuration/omoo-lab.md

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  language: zh
  font:
    text: Open Sans
    code: Cascadia Code
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: black
      toggle:
        icon: fontawesome/solid/circle-half-stroke
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: fontawesome/regular/moon
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to system preference

  features:
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.select

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2020 - 2024 Omoolab

plugins:
  - search
  - mkdocstrings
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          name: 中文
          default: true
        - locale: en
          name: English
          nav_translations:
            快捷键: Keymap

markdown_extensions:
  - mkdocs-click
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
